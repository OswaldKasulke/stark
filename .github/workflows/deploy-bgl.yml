name: Deploy immobilienmakler-bergisch-gladbach.de

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - public/**
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - .github/workflows/deploy-bgl.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-bgl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static website
        run: npm run build

      # Der Export muss vollstaendig sein, bevor er hochgeladen wird.
      # Ein halber Upload faellt sonst erst in der Suche auf.
      - name: Check export
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          pages=$(find out -name 'index.html' | wc -l | tr -d ' ')
          echo "Exportierte Seiten: $pages"
          if [ "$pages" -lt 42 ]; then
            echo "Zu wenige Seiten exportiert (erwartet mindestens 42)." >&2
            exit 1
          fi
          missing=$(grep -L 'rel="canonical"' $(find out -name 'index.html' -not -path 'out/404/*' -not -path 'out/_not-found/*') || true)
          if [ -n "$missing" ]; then
            echo "Seiten ohne Canonical:" >&2
            echo "$missing" >&2
            exit 1
          fi

      - name: Deploy to immobilienmakler-bergisch-gladbach.de
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /immobilienmakler-bergisch-gladbach.de/
          dangerous-clean-slate: false
          # Der Lauf vom 02.09.2026 scheiterte mit "550 No such file or
          # directory" beim Loeschen von _next/<build-id>: der Sync-State auf
          # dem Server fuehrte einen Ordner, den es dort nicht mehr gab. Ein
          # neuer State-Name erzwingt einen vollstaendigen Abgleich, ohne auf
          # dem Server etwas zu loeschen. Denselben Namen nutzt auch der
          # Notfall-Deploy im Repo romanbecker.de - sonst laufen beide Wege
          # mit getrenntem State auseinander.
          state-name: .ftp-deploy-sync-state-bgl-v2.json
          # Bricht ein Lauf im Upload ab, fuehrt der State Dateien als
          # uebertragen, die nie ankamen; der Folgelauf scheitert dann mit 550.
          # 120 s Timeout, weil der Hoster den Kontrollkanal langsam oeffnet.
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # Der Upload meldet auch dann Erfolg, wenn einzelne Dateien nicht
      # ankommen - siehe den Vorfall vom 27.08.2026 mit 16 alten Fassungen
      # auf dem Server. Deshalb wird live gegengeprueft.
      - name: Verify published pages
        run: |
          fail=0
          for path in "" "team" "impressum" "agb" "downloads" "datenschutz" \
                      "haus-verkaufen-bergisch-gladbach" "wohnung-verkaufen-bergisch-gladbach" \
                      "grundstueck-verkaufen-bergisch-gladbach" "stadtteile/bensberg"; do
            url="https://immobilienmakler-bergisch-gladbach.de/$path${path:+/}"
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 5 "$url")
            if [ "$code" != "200" ]; then
              echo "FEHLER $code auf $url" >&2
              fail=1
            else
              echo "OK $url"
            fi
          done
          exit $fail

      - name: Verify canonical tags
        run: |
          fail=0
          for path in "team" "impressum" "agb" "downloads" "haus-verkaufen-bergisch-gladbach" "stadtteile/refrath"; do
            expected="https://immobilienmakler-bergisch-gladbach.de/$path/"
            found=$(curl --fail --silent --retry 3 --retry-delay 5 "$expected" \
              | grep -o 'rel="canonical" href="[^"]*"' | head -1 | sed 's/.*href="//;s/"$//')
            if [ "$found" != "$expected" ]; then
              echo "Canonical falsch auf /$path/: $found (erwartet $expected)" >&2
              fail=1
            else
              echo "OK canonical /$path/"
            fi
          done
          exit $fail
