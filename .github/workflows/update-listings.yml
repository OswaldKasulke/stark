name: Update BGL Listings

# app/immobilien.ts war bis zum 29.09.2026 ein von Hand gezogener Stand vom
# 30.08.2026. Jetzt taeglich frueh: aktive Angebote und verkaufte Referenzen.
# GitHub startet geplante Laeufe oft Stunden spaeter als eingetragen (beobachtet
# 4-6 h). Deshalb zwei fruehe Termine; der zweite aendert nichts, wenn der
# erste schon den aktuellen Stand geschrieben hat.
on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings-bgl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evernest-Objekte holen
        run: node scripts/update-listings.mjs
      - name: Aenderungen pruefen
        id: changes
        run: |
          if git diff --quiet app/immobilien.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat app/immobilien.ts
          fi
      - name: Commit und Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/immobilien.ts
          git commit -m "chore(bgl): Evernest-Angebote aktualisiert [automated]"
          git push
